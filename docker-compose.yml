services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: itisgram
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 87918791
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata: